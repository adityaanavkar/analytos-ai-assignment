<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enterprise Knowledge Assistant</title>
    <style>
      body {
        color: #172033;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        margin: 0 auto;
        max-width: 760px;
        padding: 2rem 1rem;
      }
      textarea {
        box-sizing: border-box;
        min-height: 7rem;
        padding: 0.75rem;
        width: 100%;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.6rem 1rem;
      }
      #result {
        border-top: 1px solid #cbd2dc;
        margin-top: 2rem;
        padding-top: 1rem;
      }
      #error {
        color: #a31515;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Enterprise Knowledge Assistant</h1>
      <p>Ask a question about the indexed company documents.</p>
      <form id="chat-form">
        <label for="question">Question</label>
        <textarea id="question" name="question" maxlength="2000" required></textarea>
        <button id="submit" type="submit">Ask</button>
      </form>

      <p id="loading" role="status" hidden>Searching documents and preparing an answer...</p>
      <p id="error" role="alert" hidden></p>

      <section id="result" hidden aria-live="polite">
        <h2>Answer</h2>
        <p id="answer"></p>
        <p><strong>Retrieved chunks:</strong> <span id="retrieved-count">0</span></p>
        <h3>Citations</h3>
        <ul id="citations"></ul>
      </section>
    </main>

    <script>
      const form = document.querySelector("#chat-form");
      const question = document.querySelector("#question");
      const submit = document.querySelector("#submit");
      const loading = document.querySelector("#loading");
      const error = document.querySelector("#error");
      const result = document.querySelector("#result");
      const answer = document.querySelector("#answer");
      const retrievedCount = document.querySelector("#retrieved-count");
      const citations = document.querySelector("#citations");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        loading.hidden = false;
        error.hidden = true;
        result.hidden = true;
        submit.disabled = true;

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: question.value, top_k: 5 }),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(typeof payload.detail === "string" ? payload.detail : "Request failed.");
          }

          answer.textContent = payload.answer;
          retrievedCount.textContent = String(payload.retrieved_chunks);
          citations.replaceChildren();
          for (const citation of payload.citations) {
            const item = document.createElement("li");
            const location = citation.page
              ? `page ${citation.page}`
              : citation.section || "location not provided";
            item.textContent = `${citation.source} - ${location} (${citation.chunk_id})`;
            citations.appendChild(item);
          }
          if (payload.citations.length === 0) {
            const item = document.createElement("li");
            item.textContent = "No citations returned.";
            citations.appendChild(item);
          }
          result.hidden = false;
        } catch (requestError) {
          error.textContent = requestError instanceof Error ? requestError.message : "Request failed.";
          error.hidden = false;
        } finally {
          loading.hidden = true;
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
