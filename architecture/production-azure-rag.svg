<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Proposed production Azure architecture for the Enterprise Knowledge Assistant</title>
  <desc id="description">A presentation diagram showing the online RAG query path, asynchronous document ingestion, department access control, monitoring, scaling, and cost controls.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#17171b" opacity="0.025"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17171b" flood-opacity="0.11"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1677c8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7157e8"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#77747d"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", Consolas, monospace; letter-spacing: 2px; }
      .title { font: 700 38px Inter, "Segoe UI", Arial, sans-serif; fill: #17171b; }
      .subtitle { font: 400 17px Inter, "Segoe UI", Arial, sans-serif; fill: #64616a; }
      .lane { font: 700 14px "IBM Plex Mono", Consolas, monospace; letter-spacing: 3px; fill: #53505a; }
      .card-title { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #17171b; }
      .card-title-light { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .body { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #5e5b64; }
      .body-light { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #d9d7df; }
      .small { font: 600 12px Inter, "Segoe UI", Arial, sans-serif; fill: #5e5b64; }
      .small-light { font: 600 12px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .step { font: 700 12px "IBM Plex Mono", Consolas, monospace; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f3f0e6"/>
  <rect width="1920" height="1080" fill="url(#paper)"/>

  <!-- Header -->
  <text x="58" y="52" class="mono" font-size="13" font-weight="700" fill="#57545d">ENTERPRISE KNOWLEDGE ASSISTANT</text>
  <text x="58" y="96" class="title">Production Azure RAG architecture</text>
  <text x="720" y="91" class="subtitle">Secure ingestion, access-filtered retrieval, grounded generation, and observable operations</text>
  <rect x="1580" y="35" width="276" height="42" rx="21" fill="#c9ff45" stroke="#9fd51e"/>
  <circle cx="1606" cy="56" r="7" fill="#4cad67"/>
  <text x="1624" y="62" class="mono" font-size="12" font-weight="700" fill="#17171b">PROPOSED PRODUCTION</text>

  <!-- Online query lane -->
  <rect x="42" y="128" width="1836" height="418" rx="20" fill="#fbfaf4" stroke="#d6d1c5"/>
  <text x="68" y="160" class="lane">ONLINE QUERY PATH</text>
  <text x="286" y="160" class="body">Solid arrows show the synchronous request and response flow.</text>

  <!-- User card -->
  <g filter="url(#shadow)">
    <rect x="72" y="198" width="216" height="242" rx="18" fill="#17171b"/>
  </g>
  <circle cx="108" cy="235" r="18" fill="#c9ff45"/>
  <circle cx="108" cy="230" r="6" fill="#17171b"/>
  <path d="M96 246 Q108 235 120 246" fill="none" stroke="#17171b" stroke-width="3" stroke-linecap="round"/>
  <text x="136" y="241" class="card-title-light">Employees</text>
  <text x="96" y="282" class="body-light">Web chat or enterprise client</text>
  <text x="96" y="311" class="small-light">Finance  •  HR  •  Legal</text>
  <text x="96" y="333" class="small-light">IT  •  Engineering</text>
  <rect x="96" y="365" width="165" height="42" rx="10" fill="#292831" stroke="#4a4853"/>
  <text x="111" y="391" class="small-light">Question + chat history</text>

  <!-- Identity card -->
  <g filter="url(#shadow)">
    <rect x="330" y="198" width="232" height="242" rx="18" fill="#eaf5ff" stroke="#78b9eb"/>
  </g>
  <path d="M365 221 l17 7 v14 c0 13-8 23-17 28-9-5-17-15-17-28v-14z" fill="#1677c8"/>
  <path d="M357 241 l6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="398" y="241" class="card-title">Secure ingress</text>
  <text x="354" y="280" class="body">Entra ID authentication</text>
  <rect x="354" y="300" width="184" height="38" rx="9" fill="#ffffff" stroke="#b8d8ef"/>
  <text x="369" y="324" class="small">Azure Front Door + WAF</text>
  <rect x="354" y="348" width="184" height="50" rx="9" fill="#1677c8"/>
  <text x="369" y="370" class="small-light">JWT: department claim</text>
  <text x="369" y="389" class="small-light">JWT: group memberships</text>

  <!-- Application card -->
  <g filter="url(#shadow)">
    <rect x="606" y="182" width="340" height="274" rx="20" fill="#24232b"/>
  </g>
  <rect x="630" y="207" width="58" height="30" rx="15" fill="#c9ff45"/>
  <text x="647" y="227" class="mono" font-size="11" font-weight="700" fill="#17171b">API</text>
  <text x="704" y="230" class="card-title-light">Azure App Service</text>
  <text x="630" y="263" class="body-light">Autoscaled Python FastAPI application</text>
  <rect x="630" y="286" width="292" height="40" rx="9" fill="#34333d" stroke="#4c4a56"/>
  <text x="648" y="311" class="small-light">1. Query analysis and conversation rewrite</text>
  <rect x="630" y="335" width="292" height="40" rx="9" fill="#34333d" stroke="#4c4a56"/>
  <text x="648" y="360" class="small-light">2. Retrieval, fusion, and context selection</text>
  <rect x="630" y="384" width="292" height="48" rx="9" fill="#34333d" stroke="#4c4a56"/>
  <text x="648" y="405" class="small-light">3. Evidence gate and citation validation</text>
  <text x="648" y="422" class="body-light">Refuse when evidence is insufficient</text>

  <!-- Search card -->
  <g filter="url(#shadow)">
    <rect x="992" y="182" width="286" height="274" rx="20" fill="#1677c8"/>
  </g>
  <circle cx="1027" cy="222" r="17" fill="#ffffff" opacity="0.95"/>
  <circle cx="1024" cy="219" r="7" fill="none" stroke="#1677c8" stroke-width="3"/>
  <path d="M1029 225 l8 8" stroke="#1677c8" stroke-width="3" stroke-linecap="round"/>
  <text x="1055" y="230" class="card-title-light">Azure AI Search</text>
  <text x="1016" y="263" class="body-light">Enterprise knowledge index</text>
  <rect x="1016" y="286" width="238" height="38" rx="9" fill="#0f65ae"/>
  <text x="1033" y="310" class="small-light">Hybrid + vector + semantic ranking</text>
  <rect x="1016" y="334" width="238" height="38" rx="9" fill="#0f65ae"/>
  <text x="1033" y="358" class="small-light">Top-k evidence with provenance</text>
  <rect x="1016" y="382" width="238" height="50" rx="9" fill="#c9ff45"/>
  <text x="1033" y="403" class="small" fill="#17171b">Mandatory filter:</text>
  <text x="1033" y="420" class="mono" font-size="11" font-weight="700" fill="#17171b">allowed_groups / any(...)</text>

  <!-- OpenAI card -->
  <g filter="url(#shadow)">
    <rect x="1324" y="198" width="250" height="242" rx="18" fill="#7157e8"/>
  </g>
  <circle cx="1360" cy="235" r="18" fill="#ffffff" opacity="0.96"/>
  <path d="M1351 235 c0-8 9-12 15-7 7 5 4 15-3 17-7 2-13-3-12-10z" fill="none" stroke="#7157e8" stroke-width="3"/>
  <text x="1388" y="242" class="card-title-light">Azure OpenAI</text>
  <text x="1348" y="282" class="body-light">Grounded answer generation</text>
  <rect x="1348" y="304" width="202" height="38" rx="9" fill="#6047d4"/>
  <text x="1364" y="328" class="small-light">Evidence-only prompt</text>
  <rect x="1348" y="351" width="202" height="38" rx="9" fill="#6047d4"/>
  <text x="1364" y="375" class="small-light">Low-temperature generation</text>
  <text x="1348" y="411" class="body-light">Managed identity, no API keys</text>

  <!-- Answer card -->
  <g filter="url(#shadow)">
    <rect x="1620" y="198" width="220" height="242" rx="18" fill="#c9ff45" stroke="#9fd51e"/>
  </g>
  <circle cx="1657" cy="235" r="18" fill="#17171b"/>
  <path d="M1649 235 l6 6 11-13" fill="none" stroke="#c9ff45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1685" y="242" class="card-title">Grounded answer</text>
  <text x="1644" y="282" class="body" fill="#343139">Short, direct response</text>
  <rect x="1644" y="304" width="172" height="38" rx="9" fill="#f7ffe4" stroke="#9fd51e"/>
  <text x="1661" y="328" class="small" fill="#17171b">Numbered source citations</text>
  <rect x="1644" y="352" width="172" height="38" rx="9" fill="#f7ffe4" stroke="#9fd51e"/>
  <text x="1661" y="376" class="small" fill="#17171b">Auditable retrieval trace</text>
  <text x="1644" y="413" class="body" fill="#343139">Or safe refusal</text>

  <!-- Query arrows and numbered steps -->
  <line x1="288" y1="319" x2="321" y2="319" stroke="#1677c8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <circle cx="304" cy="298" r="14" fill="#1677c8"/><text x="300" y="302" class="step">1</text>
  <line x1="562" y1="319" x2="597" y2="319" stroke="#1677c8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <circle cx="579" cy="298" r="14" fill="#1677c8"/><text x="575" y="302" class="step">2</text>
  <line x1="946" y1="319" x2="983" y2="319" stroke="#1677c8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <circle cx="964" cy="298" r="14" fill="#1677c8"/><text x="960" y="302" class="step">3</text>
  <line x1="1278" y1="319" x2="1315" y2="319" stroke="#7157e8" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <circle cx="1296" cy="298" r="14" fill="#7157e8"/><text x="1292" y="302" class="step">4</text>
  <line x1="1574" y1="319" x2="1611" y2="319" stroke="#7157e8" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <circle cx="1592" cy="298" r="14" fill="#7157e8"/><text x="1588" y="302" class="step">5</text>

  <!-- Access control banner -->
  <rect x="606" y="475" width="672" height="46" rx="12" fill="#f7ffe4" stroke="#9fd51e" stroke-width="2"/>
  <path d="M631 486 l11 5 v9 c0 8-5 14-11 17-6-3-11-9-11-17v-9z" fill="#4cad67"/>
  <text x="657" y="504" class="small" fill="#20211d">Department claim → retrieval-time allowed_groups filter → unauthorized chunks never reach the model</text>

  <!-- Ingestion lane -->
  <rect x="42" y="565" width="1836" height="272" rx="20" fill="#ebe7db" stroke="#d2ccbf"/>
  <text x="68" y="599" class="lane">ASYNCHRONOUS INGESTION AND INDEXING</text>
  <text x="448" y="599" class="body">Dashed arrows show event-driven processing outside the user request path.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="632" width="260" height="158" rx="16" fill="#ffffff" stroke="#c9c3b7"/>
  </g>
  <rect x="98" y="653" width="42" height="48" rx="5" fill="#eaf5ff" stroke="#1677c8"/>
  <path d="M108 666 h22 M108 676 h22 M108 686 h15" stroke="#1677c8" stroke-width="2"/>
  <text x="158" y="674" class="card-title">Source documents</text>
  <text x="100" y="724" class="body">PDF, DOCX, XLSX</text>
  <text x="100" y="750" class="small">11 documents • 5 departments</text>
  <text x="100" y="772" class="small">Version and effective-date metadata</text>

  <g filter="url(#shadow)">
    <rect x="380" y="632" width="260" height="158" rx="16" fill="#ffffff" stroke="#78b9eb"/>
  </g>
  <ellipse cx="414" cy="667" rx="19" ry="8" fill="#1677c8"/>
  <rect x="395" y="667" width="38" height="26" fill="#1677c8"/>
  <ellipse cx="414" cy="693" rx="19" ry="8" fill="#0f65ae"/>
  <text x="452" y="674" class="card-title">Azure Blob Storage</text>
  <text x="404" y="724" class="body">Encrypted knowledge-base container</text>
  <text x="404" y="750" class="small">Versioning • retention • lifecycle rules</text>
  <text x="404" y="772" class="small">Event Grid notification on change</text>

  <g filter="url(#shadow)">
    <rect x="684" y="632" width="280" height="158" rx="16" fill="#ffffff" stroke="#c9c3b7"/>
  </g>
  <circle cx="720" cy="670" r="20" fill="#24232b"/>
  <path d="M711 670 h18 M720 661 v18" stroke="#c9ff45" stroke-width="3" stroke-linecap="round"/>
  <text x="752" y="674" class="card-title">Functions ingestion</text>
  <text x="708" y="724" class="body">Validate, parse, clean, and chunk</text>
  <text x="708" y="750" class="small">Structure-aware PDF, Word, and Excel</text>
  <text x="708" y="772" class="small">Idempotent IDs and retry queue</text>

  <g filter="url(#shadow)">
    <rect x="1008" y="632" width="300" height="158" rx="16" fill="#ffffff" stroke="#c9c3b7"/>
  </g>
  <path d="M1045 651 l22 10 v18 c0 16-10 28-22 34-12-6-22-18-22-34v-18z" fill="#c9ff45" stroke="#9fd51e"/>
  <text x="1084" y="674" class="card-title">Metadata and ACLs</text>
  <text x="1032" y="724" class="body">Attach source, page, section, owner</text>
  <text x="1032" y="750" class="small">department • allowed_groups</text>
  <text x="1032" y="772" class="small">version • effective dates • hash</text>

  <g filter="url(#shadow)">
    <rect x="1352" y="632" width="452" height="158" rx="16" fill="#eaf5ff" stroke="#1677c8"/>
  </g>
  <circle cx="1390" cy="670" r="20" fill="#7157e8"/>
  <circle cx="1390" cy="670" r="8" fill="#ffffff"/>
  <text x="1424" y="674" class="card-title">Embed and reconcile search index</text>
  <text x="1376" y="724" class="body">Azure OpenAI embeddings → Azure AI Search</text>
  <text x="1376" y="750" class="small">Deterministic upsert • stale-chunk removal</text>
  <rect x="1633" y="736" width="145" height="34" rx="17" fill="#1677c8"/>
  <text x="1650" y="758" class="small-light">186 search chunks</text>

  <!-- Ingestion arrows -->
  <line x1="336" y1="710" x2="370" y2="710" stroke="#77747d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <line x1="640" y1="710" x2="674" y2="710" stroke="#77747d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <line x1="964" y1="710" x2="998" y2="710" stroke="#77747d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <line x1="1308" y1="710" x2="1342" y2="710" stroke="#77747d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <path d="M1578 632 V590 H1135 V466" fill="none" stroke="#1677c8" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>

  <!-- Platform controls -->
  <text x="58" y="880" class="lane">CROSS-CUTTING PRODUCTION CONTROLS</text>

  <rect x="58" y="904" width="284" height="118" rx="16" fill="#24232b"/>
  <text x="82" y="936" class="card-title-light">Secrets and identity</text>
  <text x="82" y="964" class="body-light">Key Vault + managed identity</text>
  <text x="82" y="988" class="small-light">Least-privilege RBAC • keyless access</text>

  <rect x="362" y="904" width="284" height="118" rx="16" fill="#ffffff" stroke="#c9c3b7"/>
  <text x="386" y="936" class="card-title">Network security</text>
  <text x="386" y="964" class="body">Private endpoints and VNet integration</text>
  <text x="386" y="988" class="small">TLS • WAF • restricted public access</text>

  <rect x="666" y="904" width="300" height="118" rx="16" fill="#ffffff" stroke="#c9c3b7"/>
  <text x="690" y="936" class="card-title">Observability</text>
  <text x="690" y="964" class="body">Application Insights + Log Analytics</text>
  <text x="690" y="988" class="small">Latency • failures • retrieval traces • alerts</text>

  <rect x="986" y="904" width="300" height="118" rx="16" fill="#ffffff" stroke="#c9c3b7"/>
  <text x="1010" y="936" class="card-title">Scale and resilience</text>
  <text x="1010" y="964" class="body">Autoscale, queues, retries, zone readiness</text>
  <text x="1010" y="988" class="small">Cache repeated queries • graceful refusal</text>

  <rect x="1306" y="904" width="334" height="118" rx="16" fill="#ffffff" stroke="#c9c3b7"/>
  <text x="1330" y="936" class="card-title">Cost governance</text>
  <text x="1330" y="964" class="body">Budgets, alerts, quotas, token limits</text>
  <text x="1330" y="988" class="small">Bounded top-k • compact context • model routing</text>

  <rect x="1660" y="904" width="202" height="118" rx="16" fill="#c9ff45" stroke="#9fd51e"/>
  <text x="1684" y="936" class="card-title">Measured quality</text>
  <text x="1684" y="968" class="sans" font-size="26" font-weight="800" fill="#17171b">154 / 160</text>
  <text x="1684" y="994" class="small">Frozen 10-case evaluation</text>

  <!-- Footer legend -->
  <line x1="58" y1="1050" x2="96" y2="1050" stroke="#1677c8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="112" y="1055" class="small">Online request</text>
  <line x1="254" y1="1050" x2="292" y2="1050" stroke="#77747d" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="308" y="1055" class="small">Async or support flow</text>
  <rect x="511" y="1038" width="18" height="18" rx="4" fill="#c9ff45" stroke="#9fd51e"/>
  <text x="541" y="1055" class="small">Security or grounded output</text>
  <text x="890" y="1055" class="body">Current demo: local UI with Azure-hosted AI services. Production target: App Service with private, identity-based connectivity.</text>
</svg>
